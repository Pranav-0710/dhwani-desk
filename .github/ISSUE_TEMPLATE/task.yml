name: Task
description: A unit of work that becomes one branch and one PR
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes. The PR is done when all are ticked.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files or directories this task may touch.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Do not touch
      description: Files or directories that are off limits for this task.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, dependencies on other issues, open questions.
