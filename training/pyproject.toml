[project]
name = "dhwani-desk-training"
version = "0.1.0"
description = "Dhwani Desk Laya benchmark, data generation and fine-tuning (runs on Kaggle / Colab; the benchmark also runs on a laptop CPU)"
requires-python = ">=3.11"
dependencies = [
    "laya>=0.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are thin Kaggle / Colab wrappers around the scripts, full of shell lines.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
