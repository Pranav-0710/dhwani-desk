# One origin for the browser: the built pages, and the backend's sockets and API behind them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Behind cloudflared the browser's scheme is https: keep it rather than nginx's own http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Limits on the routes that take CONSOLE_TOKEN, so it cannot be guessed at speed. Behind
# cloudflared every request comes from the same address, so key on the client's IP that
# Cloudflare passes, and on the address itself without the tunnel.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    '' $binary_remote_addr;
}
limit_req_zone $client_key zone=console_api:1m rate=5r/s;
limit_req_zone $client_key zone=console_ws:1m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # The console holds a token that can speak to callers: never framed, never sniffed.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /ws/console {
        limit_req zone=console_ws burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The backend checks Origin against ALLOWED_ORIGINS: pass the browser's through.
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A call can be quiet for a while; the backend hangs up silent sockets itself.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        limit_req zone=console_api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # A rebuilt app is picked up at once; its hashed assets can be cached.
    location = /index.html {
        add_header Cache-Control no-cache always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # /supervisor and any other page path load the app, which picks the page itself.
    location / {
        try_files $uri /index.html;
    }
}
