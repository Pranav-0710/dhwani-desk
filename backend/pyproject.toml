[project]
name = "dhwani-desk-backend"
version = "0.1.0"
description = "Dhwani Desk backend: audio proxy, Gnani clients, dialogue, Laya decisions, tickets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# The Laya runtime, for DECIDER=laya: `uv sync --group laya`. Tests use a stand-in for Laya.
laya = [
    "laya[onnx]==0.4.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
