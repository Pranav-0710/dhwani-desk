[project]
name = "dhwani-desk-backend"
version = "0.1.0"
description = "Dhwani Desk backend: audio proxy, Gnani clients, dialogue, Laya decisions, tickets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# The Laya runtime, for DECIDER=laya: `uv sync --group laya`. Tests use a stand-in for Laya.
laya = [
    "laya[onnx]==0.4.6",
    # Listed so the CPU-only source below applies to it (uv sources apply to direct dependencies).
    "torch==2.14.1",
]

[tool.uv]
package = false

# Laya pulls in PyTorch. The decider runs on CPU (ONNX), so take PyTorch's CPU-only build: the
# default one brings several GB of CUDA libraries into the Docker image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
